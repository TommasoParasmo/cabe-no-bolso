name: App iOS

on:
  push:
    branches: [main]
    paths: ["mobile/**", "public/**", ".github/workflows/app-ios.yml"]
  pull_request:
    paths: ["mobile/**", "public/**", ".github/workflows/app-ios.yml"]
  workflow_dispatch:

# Por enquanto compila para o simulador, sem assinatura. O envio para o
# TestFlight entra quando a conta Apple Developer existir.
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run preparar && npx cap sync ios
      - name: Build (simulador)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
